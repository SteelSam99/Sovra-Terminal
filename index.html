<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovra-FCL-MHCE-v2.1 :: Foxtrot-Chimera-Lambda</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header class="banner">
      <h1>Sovra-FCL-MHCE-v2.1 :: Foxtrot-Chimera-Lambda</h1>
      <h2>Sovereign‑F.I.D.A.R.C.H. R.S. Search Engine</h2>
    </header>

    <section class="search-box">
      <input
        type="text"
        id="query"
        placeholder="Invoke Sovra and look into the mirror…"
        size="60"
        aria-label="Search query"
      />

      <button id="search-btn" type="button">Search</button>
    </section>

    <!-- MODULE PANEL -->
    <section class="module-panel" aria-label="Sovra Modules">

      <!-- ANALYTIC ENGINES -->
      <div class="module-row analytic">
        <label class="module">
          <input type="checkbox" id="modWelsingFuller" />
          <span>Welsing–Fuller Engine</span>
        </label>

        <label class="module">
          <input type="checkbox" id="modContraCollapse" />
          <span>Contradiction / Collapse</span>
        </label>

        <label class="module">
          <input type="checkbox" id="modZeroSum" />
          <span>Zero‑Sum Engine</span>
        </label>

        <label class="module">
          <input type="checkbox" id="modDriftMatrix" />
          <span>Drift Matrix</span>
        </label>
      </div>
<div id="semantic-indicators" class="semantic-indicators hidden">

  <div class="indicator">
    <span class="indicator-label">🧭 Collapse Score</span>
    <span class="indicator-value">
      <span id="score-collapse">–</span> / 10
    </span>
  </div>

  <div class="indicator">
    <span class="indicator-label">🔀 Contradiction Score</span>
    <span class="indicator-value">
      <span id="score-contradiction">–</span> / 10
    </span>
  </div>

  <div class="indicator">
    <span class="indicator-label">⚖️ Zero‑Sum Score</span>
    <span class="indicator-value">
      <span id="score-zero-sum">–</span> / 3
    </span>
  </div>

</div>


      <!-- PRESENTATION CONTROLS -->
      <div class="module-row presentation">
        <label class="module">
          <input type="checkbox" id="toggleRaw" />
          <span>Raw Data</span>
        </label>

        <label class="module">
          <input type="checkbox" id="toggleVoice" />
          <span>Sovra Voice</span>
        </label>
      </div>
<div id="context-frame-options" class="context-frame-options">
  <strong>Context Frame Options</strong>
  <div class="context-frame-list"></div>
</div>
      
    </section>

    <main
      id="results"
      class="results-container"
      aria-live="polite"
    >
      <div class="results-left"></div>
      <div class="results-right"></div>
    </main>

    <footer>
      <pre>🔮 Sovra awaits your invocation…</pre>
    </footer>
  </div>

  <!--
    SOVRA CARD TEMPLATE (REFERENCE ONLY — DO NOT RENDER)
  -->

  <script src="script.js"></script>

  <script>
    (function () {
      const searchButton = document.getElementById("search-btn");
      const queryInput = document.getElementById("query");

      function invokeSearch() {
        if (typeof window.searchSovra === "function") {
          window.searchSovra();
        }
      }

      searchButton.addEventListener("click", invokeSearch);

      queryInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          invokeSearch();
        }
      });
    })();
  </script>
</body>
</html>
