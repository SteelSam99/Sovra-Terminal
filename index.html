<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovra-FCL-MHCE-v2.1 :: Foxtrot-Chimera-Lambda</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header class="banner">
      <h1>Sovra-FCL-MHCE-v2.1 :: Foxtrot-Chimera-Lambda</h1>
      <h2>Sovereign‑F.I.D.A.R.C.H. R.S. Search Engine</h2>
    </header>

    <section class="search-box">
      <input
        type="text"
        id="query"
        placeholder="Invoke Sovra and look into the mirror…"
        size="60"
        aria-label="Search query"
      />

      <label>
        <input type="checkbox" id="toggleRaw" />
        Compare with raw results
      </label>

      <button id="search-btn" type="button">Search</button>
    </section>

    <main
      id="results"
      class="results-container"
      aria-live="polite"
    >
      <div class="results-left"></div>
      <div class="results-right"></div>
    </main>

    <footer>
      <pre>🔮 Sovra awaits your invocation…</pre>
    </footer>
  </div>

  <!--
    SOVRA CARD TEMPLATE (REFERENCE ONLY — DO NOT RENDER)

    <article class="sovra-card" role="article">
      ...
    </article>
  -->

  <script src="script.js"></script>

  <script>
    (function () {
      const searchButton = document.getElementById("search-btn");
      const queryInput = document.getElementById("query");

      function invokeSearch() {
        if (typeof window.searchSovra === "function") {
          window.searchSovra();
        }
      }

      searchButton.addEventListener("click", invokeSearch);

      queryInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          invokeSearch();
        }
      });
    })();
  </script>
</body>
</html>
